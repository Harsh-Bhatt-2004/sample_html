<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sample Dashboard</title>

```
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #1E1E1E;
        color: #FFFFFF;
    }

    header {
        background-color: #121212;
        padding: 15px;
        text-align: center;
        color: #E06C80;
        font-size: 22px;
    }

    .container {
        padding: 20px;
    }

    .card {
        background-color: #2A2A2A;
        padding: 15px;
        margin: 10px 0;
        border-radius: 8px;
    }

    .card h3 {
        margin: 0;
        color: #CCCCCC;
    }

    .card p {
        font-size: 24px;
        color: #E06C80;
        margin-top: 10px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        background-color: #2A2A2A;
    }

    table, th, td {
        border: 1px solid #444;
    }

    th, td {
        padding: 10px;
        text-align: center;
    }

    th {
        background-color: #333;
    }
</style>
```

</head>

<body>

<header>
    Production Dashboard
</header>

<div class="container">
